# MASA式 売買判定ロジック 全体設定
# 環境ごとに変える値は .env / 環境変数から読み込み、ここには「ロジックのパラメータ」だけを置く。

app:
  timezone: "Asia/Tokyo"
  # 判定を実行する市場の取引時間(参考値。実行スケジュール自体は cron / GitHub Actions 側で管理)
  market_close_time: "15:00"

data:
  # 株価データの取得元。今はyfinanceのみ対応。
  source: "yfinance"
  # 判定に使うローソク足の間隔
  interval: "1d"
  # 何営業日分のヒストリカルデータを取得するか
  lookback_days: 250
  # 取得したCSVキャッシュの保存先(このファイルからの相対パス)
  cache_dir: "../data"

masa_logic:
  # MASA式の主要パラメータ(仮値。実ロジック実装時に調整する)
  moving_averages:
    short: 5
    medium: 25
    long: 75
  volume_spike_ratio: 2.0      # 出来高が平均の何倍で「急増」とみなすか
  volume_average_window: 20    # 出来高の平均を取る日数
  rsi_period: 14
  rsi_overbought: 70
  rsi_oversold: 30
  # 判定スコアの閾値。これ以上で「買いシグナル」、以下で「売りシグナル」
  buy_score_threshold: 3
  sell_score_threshold: -3

notify:
  enabled: true
  # 通知先チャネル。必要なものだけ有効化し、認証情報は .env で渡す。
  channels:
    slack: false
    line: false
    email: false

logging:
  level: "INFO"
  dir: "../logs"
  filename: "masa_trade.log"
  max_bytes: 1048576
  backup_count: 7
